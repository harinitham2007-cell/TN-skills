<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - Gemini 3.8 Flash
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<main class="container">

    <section class="hero">

        <span class="badge">
            Gemini 3.8 Flash
        </span>

        <h1>
            EduGenie
        </h1>

        <p>
            Your AI-powered learning assistant for
            questions, explanations, quizzes,
            summaries, and personalized learning paths.
        </p>

    </section>


    <section class="card">

        <label for="task">
            Choose a task
        </label>

        <select id="task">

            <option value="qa">
                Ask a Question
            </option>

            <option value="explain">
                Explain a Topic
            </option>

            <option value="summarize">
                Summarize Text
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="recommendations">
                Learning Recommendations
            </option>

        </select>


        <div id="level-group">

            <label for="level">
                Learner Level
            </label>

            <select id="level">

                <option value="beginner">
                    Beginner
                </option>

                <option value="intermediate">
                    Intermediate
                </option>

                <option value="advanced">
                    Advanced
                </option>

            </select>

        </div>


        <div
            id="goal-group"
            class="hidden"
        >

            <label for="goal">
                Learning Goal
            </label>

            <input
                id="goal"
                type="text"
                placeholder="Example: prepare for an exam"
            >

        </div>


        <label
            for="inputText"
            id="inputLabel"
        >
            Your Question
        </label>


        <textarea
            id="inputText"
            rows="9"
            placeholder="Type your question here..."
        ></textarea>


        <button id="submitBtn">
            Generate
        </button>

    </section>


    <section class="card">

        <h2>
            Result
        </h2>


        <div
            id="loading"
            class="hidden"
        >
            EduGenie is thinking...
        </div>


        <div id="result">
            Your result will appear here.
        </div>

    </section>

</main>


<script src="/static/app.js"></script>

</body>

</html>
